<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CosteApp by AkumaNet</title>
  <meta name="description" content="Costos, fórmulas, rentabilidad y pedidos para emprendedores. Desarrollado por AkumaNet. Autor: Juan Carlos Ojeda Huanca.">
  <meta name="author" content="Juan Carlos Ojeda Huanca (AkumaNet)">
  <meta name="copyright" content="© AkumaNet. Todos los derechos reservados.">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CosteApp">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0e1218; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
    #splash {
      position: fixed; inset: 0; z-index: 2; background: #0e1218; color: #f1f5f9;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .35s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 24px; }
    #splash .barra { width: 120px; height: 4px; border-radius: 4px; background: #2a3240; overflow: hidden; }
    #splash .barra i { display: block; width: 40%; height: 100%; background: #3b6ae0; border-radius: 4px; animation: carga 1.1s ease-in-out infinite; }
    #splash small { color: #94a3b8; font-size: 12px; text-align: center; line-height: 1.5; }
    #splash .by { font-size: 12px; font-weight: 600; color: #8fb0ff; margin-top: -10px; }
    #splash.oculto { opacity: 0; pointer-events: none; }
    #offline { display: none; color: #f59e0b; font-size: 13px; text-align: center; padding: 0 24px; }
    @keyframes carga { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="CosteApp">
    <strong>CosteApp</strong>
    <span class="by">by AkumaNet</span>
    <div class="barra"><i></i></div>
    <p id="offline">Sin conexión a internet. CosteApp necesita conexión para abrir.<br><br><button onclick="location.reload()">Reintentar</button></p>
    <small>Desarrollado por AkumaNet<br>Autor: Juan Carlos Ojeda Huanca</small>
  </div>
  <iframe id="app" title="CosteApp" allow="clipboard-write"></iframe>

  <script>
    // ⚠️ PEGAR AQUÍ la URL de tu Web App de Apps Script (termina en /exec)
    var GAS_URL = 'https://script.google.com/macros/s/PEGAR_AQUI_TU_ID/exec';

    var splash = document.getElementById('splash');
    var frame = document.getElementById('app');
    if (!navigator.onLine) {
      document.getElementById('offline').style.display = 'block';
    } else {
      // Pasa los parámetros (?tab=pedidos, ?pago=ok) a la app
      frame.src = GAS_URL + location.search;
      frame.addEventListener('load', function () { setTimeout(function () { splash.classList.add('oculto'); }, 400); });
      setTimeout(function () { splash.classList.add('oculto'); }, 12000);
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
  </script>
</body>
</html>
